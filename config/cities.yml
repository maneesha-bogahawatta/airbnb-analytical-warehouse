# Inside Airbnb — Unified configuration
# -----------------------------------------------------------------------------
# Keeps compatibility for both the download script and the warehouse engine.

active_city: barcelona

active_cities:
  - barcelona
  - madrid

cities:
  barcelona:
    name: Barcelona
    country: spain
    region: catalonia
    city_slug: barcelona
    snapshot_date: "2025-12-14"
    base_url: "https://data.insideairbnb.com"
    files:
      detailed:
        - listings.csv.gz
        - calendar.csv.gz
        - reviews.csv.gz
      visualisations:
        - neighbourhoods.csv

  madrid:
    name: Madrid
    country: spain
    region: community-of-madrid
    city_slug: madrid
    snapshot_date: "2025-12-15"
    base_url: "https://data.insideairbnb.com"
    files:
      detailed:
        - listings.csv.gz
        - calendar.csv.gz
        - reviews.csv.gz
      visualisations:
        - neighbourhoods.csv