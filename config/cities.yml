# Inside Airbnb — Unified configuration
# -----------------------------------------------------------------------------
# Keeps compatibility for both the download script and the warehouse engine.

active_city: barcelona

active_cities:
  - barcelona
  - madrid
  - lisbon

cities:
  barcelona:
    name: Barcelona
    country: spain
    region: catalonia
    city_slug: barcelona
    snapshot_date: "2025-12-14"
    base_url: "https://data.insideairbnb.com"
    files:
      detailed:
        - listings.csv.gz
        - calendar.csv.gz
        - reviews.csv.gz
      visualisations:
        - neighbourhoods.csv

  madrid:
    name: Madrid
    country: spain
    region: comunidad-de-madrid
    city_slug: madrid
    snapshot_date: "2025-09-14"
    base_url: "https://data.insideairbnb.com"
    files:
      detailed: [listings.csv.gz, calendar.csv.gz, reviews.csv.gz]
      visualisations: [listings.csv, reviews.csv, neighbourhoods.csv, neighbourhoods.geojson]

  lisbon:
    name: Lisbon
    country: portugal
    region: lisbon
    city_slug: lisbon
    snapshot_date: "2026-03-26"
    base_url: "https://data.insideairbnb.com"
    files:
      detailed: [listings.csv.gz, calendar.csv.gz, reviews.csv.gz]
      visualisations: [listings.csv, reviews.csv, neighbourhoods.csv, neighbourhoods.geojson]