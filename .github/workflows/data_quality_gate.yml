name: Production Data Quality Assurance Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline-validation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Configure Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Application Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install duckdb pandas scipy matplotlib seaborn

    - name: Execute End-to-End Analytics Pipeline
      run: |
        chmod +x run_pipeline.sh
        ./run_pipeline.sh

    - name: Enforce Data Quality Rules as Code
      run: |
        python3 -c "
        import duckdb
        conn = duckdb.connect('data/airbnb_warehouse.db')
        
        # Test 1: Primary Key Uniqueness Test
        pk_check = conn.execute('SELECT COUNT(listing_id) - COUNT(DISTINCT listing_id) FROM dim_listings').fetchone()[0]
        assert pk_check == 0, f'❌ Data Quality Failure: Duplicate keys found: {pk_check}'
        
        # Test 2: Logical Boundaries Check
        invalid_prices = conn.execute('SELECT COUNT(*) FROM dim_listings WHERE price < 0').fetchone()[0]
        assert invalid_prices == 0, '❌ Data Quality Failure: Negative prices found.'
        
        print('🎉 All data validation gates passed successfully!')
        "